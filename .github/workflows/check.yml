name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deployment:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ['1.3.14', 'latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install development dependencies
        run: bun install --frozen-lockfile
      - name: Check shell entry point
        run: bash -n apply.sh
      - name: Typecheck and test deployment behavior
        run: bun run check
      - name: Check whitespace
        run: git diff --check
